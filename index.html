<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Magic - Sort Puzzle</title>
    <script src="https://connect.facebook.net/en_US/fbinstant.6.3.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Relief:wght@700&display=swap');

        :root {
            --bg-color: #1f140e;
            --bg-pattern: url('https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/bg.jpg');
            --bg-size: auto; 
            --tube-border: rgba(255, 255, 255, 0.3);
            --tube-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; font-family: "Comic Relief", system-ui; font-weight: 700; color: #fff; overflow: hidden; touch-action: manipulation;
            background-color: var(--bg-color);
            background-image: var(--bg-pattern);
            background-size: var(--bg-size);
            background-repeat: repeat;
        }

        #game-logo-img {
            height: 88px; width: auto; object-fit: contain; margin: 10px 0 2px 0;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); display: none;
        }

        .header-section { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 5px; padding-top: 5px; }
        .game-info { display: flex; justify-content: space-around; align-items: center; width: 100%; max-width: 420px; font-size: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); padding: 0 5px; box-sizing: border-box; color: #ffd700; font-family: "Comic Relief", system-ui; font-weight: 700; }
        .level-select-wrapper { background: linear-gradient(135deg, #ffe066 0%, #d4af37 100%); border: 2px solid #8c6b14; border-radius: 6px; padding: 2px 8px; color: #3e2700; font-family: "Comic Relief", system-ui; font-weight: 700; font-size: 14px; cursor: pointer; outline: none; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
        .level-select-wrapper option:disabled { color: #999; background: #ddd; }

        #game-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100dvh; padding: 10px 0; box-sizing: border-box; }
        .board-section { flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; }

        .board { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; max-width: 100vw; padding: 0; box-sizing: border-box; }
        .row { display: flex; justify-content: center; gap: 6px; width: 100%; }
        
        .tube {
            width: 36px; height: 215px; border-radius: 2px 2px 18px 18px; 
            display: flex; flex-direction: column-reverse; align-items: center; padding-bottom: 6px; position: relative; cursor: pointer; 
            box-shadow: inset 0 -8px 15px rgba(0,0,0,0.5); -webkit-tap-highlight-color: transparent; transition: box-shadow 0.3s ease, border-color 0.3s ease;
            background: var(--tube-bg);
            border: 2px solid var(--tube-border);
        }
        
        .tube.selected { border-color: #ffd700; box-shadow: 0 0 12px #ffd700, inset 0 -8px 15px rgba(0,0,0,0.5); }
        .tube.completed-magic { border-color: #00ffff; box-shadow: 0 0 20px #00ffff, inset 0 -8px 15px rgba(0,255,255,0.4); animation: pulseGlow 1.5s infinite alternate; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 10px #00ffff, inset 0 -8px 15px rgba(0,255,255,0.4); } 100% { box-shadow: 0 0 25px #ff77ff, inset 0 -8px 15px rgba(255,119,255,0.6); } }

        .ball { 
            position: relative; 
            width: 28px; height: 28px; border-radius: 50%; margin-top: 3px; 
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.5); 
        }
        .ball.jump { transform: translateY(-14px); }

        #btn-mute { 
            position: fixed; bottom: 20px; right: 20px; z-index: 1000; 
            width: 44px; height: 44px; 
            background: transparent; border: none; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; padding: 0;
            -webkit-tap-highlight-color: transparent; transition: transform 0.1s ease;
        }
        #btn-mute:active { transform: scale(0.85); }
        #btn-mute img { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }

        /* ================= GIAO DIỆN POPUP ẢNH CUSTOM (CẬP NHẬT TỶ LỆ LỚN) ================= */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.85); z-index: 2000; justify-content: center; align-items: center; padding: 24px; box-sizing: border-box; 
        }
        
        .modal-orb {
            width: 400px; height: 400px; /* Phóng to kích thước để hiển thị trọn vẹn chi tiết */
            background-image: url('https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/icons/popup-bg.png');
            background-size: contain; background-position: center; background-repeat: no-repeat;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; position: relative;
            font-family: "Comic Relief", system-ui; font-weight: 700;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9)); /* Thêm bóng đổ cho quả bóng */
        }

        /* Chữ Title nhô lên khỏi quả bóng và được kéo lên cao hơn */
        .modal-title-img {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 82%; height: auto; object-fit: contain;
            pointer-events: none;
        }

        /* Vùng nội dung chữ màu Nâu bên trong được nới rộng xuống dưới */
        .modal-content-area {
            margin-top: 50px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #4a2f1d; width: 100%;
        }

        .modal-subtitle { font-size: 22px; font-weight: 700; margin-bottom: 8px; line-height: 1.3;}
        .score-large { font-size: 68px; color: #e65134; margin: -5px 0 10px 0; line-height: 1; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }
        .score-small { font-size: 18px; margin: 4px 0; }
        .val-blue { color: #3baaf8; }
        .val-orange { color: #e65134; }

        .modal-buttons { display: flex; gap: 15px; margin-top: 20px; }
        
        .btn-custom {
            background-color: transparent; border: none; outline: none;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            width: 140px; height: 52px;
            color: white; font-family: "Comic Relief", system-ui; font-weight: 700; font-size: 19px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; padding: 0 0 4px 0; 
            transition: transform 0.1s; letter-spacing: 0.5px;
            text-shadow: 
                2px 2px 0 rgba(0,0,0,0.68), -2px -2px 0 rgba(0,0,0,0.68), 
                2px -2px 0 rgba(0,0,0,0.68), -2px 2px 0 rgba(0,0,0,0.68), 
                2px 0 0 rgba(0,0,0,0.68), -2px 0 0 rgba(0,0,0,0.68), 
                0 2px 0 rgba(0,0,0,0.68), 0 -2px 0 rgba(0,0,0,0.68);
        }
        .btn-custom:active { transform: scale(0.92); }
        .btn-blue { background-image: url('https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/icons/bt_blue.png'); }
        .btn-green { background-image: url('https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/icons/bt_green.png'); }

    </style>
</head>
<body>

    <div id="game-screen">
        <img id="game-logo-img" src="https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/logo_ballmagic.png" alt="Ball Magic Logo">
        <div class="header-section">
            <div class="game-info">
                <span>LV: <select id="level-dropdown" class="level-select-wrapper" onchange="onLevelSelectChange(this)"></select></span>
                <span>MIN: <span id="min-moves" style="color:#a3ffcc;">...</span></span>
                <span>MOVES: <span id="player-moves" style="color:#ffd700;">0</span></span>
            </div>
        </div>
        <div class="board-section">
            <div class="board" id="board"></div>
        </div>
    </div>

    <button id="btn-mute" onclick="toggleMute()">
        <img id="mute-icon" src="https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/icons/volume-max.svg" alt="Volume">
    </button>

    <!-- Modal Popup Sử Dụng Ảnh Ảnh Đã Cắt -->
    <div id="result-modal" class="modal-overlay">
        <div class="modal-orb">
            <!-- Ảnh Title Win/Lose chèn bên trên bóng -->
            <img id="modal-title-img" src="" class="modal-title-img">
            
            <div class="modal-content-area">
                <div id="modal-subtitle" class="modal-subtitle"></div>
                <div id="modal-score" class="score-large"></div>
                
                <div id="modal-metrics-box">
                    <div class="score-small">Min Moves level <span id="modal-lvl-text"></span>: <span id="modal-min-moves" class="val-blue"></span></div>
                    <div class="score-small">Best Moves: <span id="modal-best-moves" class="val-orange"></span></div>
                </div>

                <div class="modal-buttons">
                    <button id="modal-btn-left" class="btn-custom btn-blue"></button>
                    <button id="modal-btn-right" class="btn-custom btn-green"></button>
                </div>
            </div>
        </div>
    </div>

    <div id="flying-ball-container"></div>

    <script>
        let gameData = null;
        let currentLevel = parseInt(localStorage.getItem('ballmagic_current_level')) || 1;
        let tubes = []; let initialTubesState = []; let undoStack = []; 
        let selectedTubeIndex = null; let playerMoves = 0; let hiddenBalls = [];
        const TUBE_CAPACITY = 6; 
        let activeLevelList = []; 
        let isGameWon = false;

        async function loadOfflineData() {
            try {
                let res = await fetch('data.json');
                gameData = await res.json();
            } catch (e) {
                console.error("Lỗi tải data.json:", e);
                gameData = { config: {}, activeLevels: [], levels: {} };
            }
        }

        function applyGameConfig() {
            let config = gameData.config || {};
            const logoImg = document.getElementById('game-logo-img');
            if (config.showTitle) { logoImg.style.display = 'block'; } else { logoImg.style.display = 'none'; }
            if (config.bgColor) document.documentElement.style.setProperty('--bg-color', config.bgColor);
            if (config.bgPattern) {
                let pattern = config.bgPattern;
                if (!pattern.startsWith('url') && !pattern.startsWith('linear')) pattern = `url('${pattern}')`;
                document.documentElement.style.setProperty('--bg-pattern', pattern);
                document.documentElement.style.setProperty('--bg-size', 'auto'); 
            }
            if (config.tubeBorder) document.documentElement.style.setProperty('--tube-border', config.tubeBorder);
            if (config.tubeBg) document.documentElement.style.setProperty('--tube-bg', config.tubeBg);
        }

        function setupActiveLevels() {
            activeLevelList = gameData.activeLevels || [];
            const dropdown = document.getElementById('level-dropdown'); dropdown.innerHTML = '';
            for (let i = 1; i <= 80; i++) {
                let opt = document.createElement('option'); opt.value = i;
                if (activeLevelList.includes(i)) opt.innerText = `Level ${i}`;
                else { opt.innerText = `Level ${i} 🔒`; opt.disabled = true; }
                dropdown.appendChild(opt);
            }
            if (activeLevelList.length > 0 && !activeLevelList.includes(currentLevel)) currentLevel = activeLevelList[0];
            dropdown.value = currentLevel;
        }

        function getRandomLevelData(levelNum) {
            let list = gameData.levels[levelNum];
            if (list && list.length > 0) return list[Math.floor(Math.random() * list.length)]; 
            return null;
        }

        let audioCtx = null; let isMuted = false;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        document.body.addEventListener('pointerdown', initAudio, {once: true});
        
        function toggleMute() { 
            initAudio(); 
            isMuted = !isMuted; 
            let muteEl = document.getElementById('mute-icon'); 
            muteEl.src = isMuted 
                ? 'https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/icons/volume-x.svg' 
                : 'https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/icons/volume-max.svg'; 
        }

        function playSfx(type) {
            if (isMuted || !audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
            if (type === 'jump') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); } 
            else if (type === 'drop') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); } 
            else if (type === 'error') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2); } 
            else if (type === 'win') { const notes = [261.63, 329.63, 392.00, 523.25]; notes.forEach((freq, i) => { const oscW = audioCtx.createOscillator(); const gainW = audioCtx.createGain(); oscW.connect(gainW); gainW.connect(audioCtx.destination); oscW.type = 'sine'; oscW.frequency.setValueAtTime(freq, now + i * 0.1); gainW.gain.setValueAtTime(0.2, now + i * 0.1); gainW.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2); oscW.start(now + i * 0.1); oscW.stop(now + i * 0.1 + 0.2); }); }
        }

        window.onload = async function() { 
            document.getElementById('board').innerHTML = '<div style="color:#ffd700; font-size: 18px; margin-top:50px;">Loading Magic...</div>';
            
            await loadOfflineData();
            applyGameConfig();
            setupActiveLevels();

            if (activeLevelList.length === 0) document.getElementById('board').innerHTML = '<div style="color:#ff5252; font-size: 18px; text-align: center; margin-top:50px;">NO LEVELS FOUND!<br><span style="font-size:14px; color:#aaa;">(data.json is missing or empty)</span></div>';
            else initLevel(currentLevel);
        };

        function onLevelSelectChange(select) { 
            currentLevel = parseInt(select.value);
            localStorage.setItem('ballmagic_current_level', currentLevel);
            initLevel(currentLevel); 
        }

        function initLevel(level) {
            currentLevel = level; 
            localStorage.setItem('ballmagic_current_level', currentLevel);
            document.getElementById('level-dropdown').value = currentLevel;
            hiddenBalls = []; document.getElementById('flying-ball-container').innerHTML = '';
            playerMoves = 0; document.getElementById('player-moves').innerText = playerMoves;
            document.getElementById('min-moves').innerText = 'Load...';
            isGameWon = false;

            let serverData = getRandomLevelData(currentLevel);

            if (serverData) {
                const newPalette = [
                    '#ff4141', '#10c278', '#0068ff', '#ff8c00', 
                    '#ffd000', '#00d0eb', '#6100ed', '#6c6c6c', 
                    '#7dd800', '#d30756', '#c600cc', '#cacaca'
                ];
                let levelColorMap = {};
                let paletteIdx = 0;

                let fixedMatrix = serverData.matrix.map(tube => 
                    tube.map(color => {
                        if (/^[0-9A-Fa-f]{6}$/.test(color)) color = '#' + color;
                        if (!levelColorMap[color]) {
                            levelColorMap[color] = newPalette[paletteIdx % newPalette.length];
                            paletteIdx++;
                        }
                        return levelColorMap[color];
                    })
                );

                tubes = JSON.parse(JSON.stringify(fixedMatrix)); 
                initialTubesState = JSON.parse(JSON.stringify(tubes));
                undoStack = []; selectedTubeIndex = null; renderBoard();
                document.getElementById('min-moves').innerText = (serverData.metrics && serverData.metrics.minMoves) ? serverData.metrics.minMoves : '...';
            } else {
                document.getElementById('board').innerHTML = '<div style="color:#ff5252; font-size: 20px; text-align: center; margin-top:50px;">LEVEL NOT AVAILABLE</div>';
                document.getElementById('min-moves').innerText = '-';
            }
        }

        function restartLevel() { playSfx('drop'); initLevel(currentLevel); }
        
        // ================= HỆ THỐNG POPUP CUSTOM ẢNH =================
        function closeResultModal() {
            playSfx('drop');
            document.getElementById('result-modal').style.display = 'none';
        }

        function showWinModal() {
            let minVal = document.getElementById('min-moves').innerText;
            let bestKey = 'ballmagic_best_lv_' + currentLevel;
            let savedBest = localStorage.getItem(bestKey);
            
            if (!savedBest || playerMoves < parseInt(savedBest)) {
                savedBest = playerMoves; 
                localStorage.setItem(bestKey, savedBest);
            }

            document.getElementById('modal-title-img').src = 'https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/icons/title-win.png';
            
            document.getElementById('modal-subtitle').innerHTML = "Your moves";
            document.getElementById('modal-score').style.display = 'block';
            document.getElementById('modal-score').innerText = playerMoves;

            document.getElementById('modal-metrics-box').style.display = 'block';
            document.getElementById('modal-lvl-text').innerText = currentLevel;
            document.getElementById('modal-min-moves').innerText = minVal;
            document.getElementById('modal-best-moves').innerText = savedBest;

            let btnLeft = document.getElementById('modal-btn-left');
            btnLeft.style.display = 'flex';
            btnLeft.innerText = "REPLAY";
            btnLeft.onclick = () => { closeResultModal(); restartLevel(); };

            let btnRight = document.getElementById('modal-btn-right');
            btnRight.innerText = "NEXT LEVEL";
            btnRight.onclick = () => { closeResultModal(); nextLevelLogic(); };

            document.getElementById('result-modal').style.display = 'flex';
        }

        function showLoseModal() {
            let minVal = document.getElementById('min-moves').innerText;
            let bestKey = 'ballmagic_best_lv_' + currentLevel;
            let savedBest = localStorage.getItem(bestKey) || "...";

            document.getElementById('modal-title-img').src = 'https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/icons/title-lose.png';
            
            document.getElementById('modal-subtitle').innerHTML = "Try going back<br>or resetting the game.";
            document.getElementById('modal-score').style.display = 'none';

            document.getElementById('modal-metrics-box').style.display = 'block';
            document.getElementById('modal-lvl-text').innerText = currentLevel;
            document.getElementById('modal-min-moves').innerText = minVal;
            document.getElementById('modal-best-moves').innerText = savedBest;

            let btnLeft = document.getElementById('modal-btn-left');
            btnLeft.style.display = 'flex';
            btnLeft.innerText = "RETURN"; 
            btnLeft.onclick = () => { closeResultModal(); undoMove(); };

            let btnRight = document.getElementById('modal-btn-right');
            btnRight.innerText = "RESET";
            btnRight.onclick = () => { closeResultModal(); restartLevel(); };

            document.getElementById('result-modal').style.display = 'flex';
        }

        function nextLevelLogic() {
            let currentIndexInList = activeLevelList.indexOf(currentLevel);
            if (currentIndexInList !== -1 && currentIndexInList < activeLevelList.length - 1) {
                currentLevel = activeLevelList[currentIndexInList + 1]; 
                initLevel(currentLevel);
            } else {
                document.getElementById('modal-title-img').src = 'https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/icons/title-win.png';
                document.getElementById('modal-subtitle').innerHTML = "You have beaten<br>all available levels!";
                document.getElementById('modal-score').style.display = 'none';
                document.getElementById('modal-metrics-box').style.display = 'none';
                
                document.getElementById('modal-btn-left').style.display = 'none';
                document.getElementById('modal-btn-right').innerText = "CLOSE";
                document.getElementById('modal-btn-right').onclick = closeResultModal;
                
                document.getElementById('result-modal').style.display = 'flex';
            }
        }
        // ===========================================================

        function isWonState(state) { return state.every(t => t.length === 0 || (t.length === TUBE_CAPACITY && new Set(t).size === 1)); }
        function getCanonicalSignature(state) { let copies = state.map(t => [...t]); copies.sort((a, b) => a.join(',').localeCompare(b.join(','))); return JSON.stringify(copies); }
        
        async function checkSolvability(tubesState) {
            if (isWonState(tubesState)) return true;
            let queue = [JSON.parse(JSON.stringify(tubesState))]; 
            let visited = new Set(); visited.add(getCanonicalSignature(tubesState));
            let iterations = 0; const MAX_ITERATIONS = 50000;

            while (queue.length > 0) {
                if (iterations % 1000 === 0) await new Promise(resolve => setTimeout(resolve, 0));
                iterations++; let current = queue.shift();
                if (isWonState(current)) return true;
                for (let i = 0; i < current.length; i++) {
                    if (current[i].length === 0) continue;
                    let topColor = current[i][current[i].length - 1];
                    for (let j = 0; j < current.length; j++) {
                        if (i === j) continue;
                        let target = current[j]; let space = TUBE_CAPACITY - target.length;
                        if (space > 0 && (target.length === 0 || target[target.length - 1] === topColor)) {
                            let nextState = JSON.parse(JSON.stringify(current));
                            while (nextState[i].length > 0 && nextState[i][nextState[i].length - 1] === topColor && nextState[j].length < TUBE_CAPACITY) nextState[j].push(nextState[i].pop());
                            let sig = getCanonicalSignature(nextState);
                            if (!visited.has(sig)) { visited.add(sig); queue.push(nextState); }
                        }
                    }
                }
                if (iterations > MAX_ITERATIONS) return true;
            }
            return false;
        }

        function checkWin() {
            if (isGameWon) return false;
            let win = tubes.every(tube => tube.length === 0 || (tube.length === TUBE_CAPACITY && new Set(tube).size === 1));
            if (win) { isGameWon = true; playSfx('win'); setTimeout(() => { showWinModal(); }, 400); return true; }
            return false;
        }

        function checkGameOver() {
            if (isGameWon) return; let canMove = false;
            for (let i = 0; i < tubes.length; i++) {
                if (tubes[i].length === 0) continue; 
                let topColor = tubes[i][tubes[i].length - 1]; let consecutiveCount = 0;
                for(let k = tubes[i].length - 1; k >= 0; k--) { if(tubes[i][k] === topColor) consecutiveCount++; else break; }
                for (let j = 0; j < tubes.length; j++) {
                    if (i === j) continue; 
                    let targetSpace = TUBE_CAPACITY - tubes[j].length;
                    if (targetSpace > 0) {
                        if (tubes[j].length > 0 && tubes[j][tubes[j].length - 1] === topColor) { canMove = true; break; } 
                        else if (tubes[j].length === 0) { if (tubes[i].length > consecutiveCount) { canMove = true; break; } }
                    }
                }
                if (canMove) break;
            }
            if (!canMove) { playSfx('error'); showLoseModal(); }
        }

        function renderBoard() {
            const board = document.getElementById('board'); board.innerHTML = '';
            const numTubes = tubes.length; const topCount = Math.ceil(numTubes / 2);
            const rows = [ tubes.slice(0, topCount), tubes.slice(topCount) ];
            
            let globalIndex = 0;
            rows.forEach((rowTubes) => {
                if (rowTubes.length === 0) return;
                const rowDiv = document.createElement('div'); rowDiv.className = 'row';
                rowTubes.forEach((tube) => {
                    let currentIndex = globalIndex++; const tubeDiv = document.createElement('div');
                    let isComplete = (tube.length === TUBE_CAPACITY && new Set(tube).size === 1);
                    let isWaitingForBall = hiddenBalls.some(h => h.tube === currentIndex);
                    
                    tubeDiv.className = `tube ${selectedTubeIndex === currentIndex ? 'selected' : ''} ${isComplete && !isWaitingForBall ? 'completed-magic' : ''}`;
                    tubeDiv.setAttribute('data-index', currentIndex);
                    tubeDiv.onclick = () => handleTubeClick(currentIndex);
                    
                    tube.forEach((ballColor, ballIndex) => {
                        const ballDiv = document.createElement('div'); ballDiv.className = 'ball'; ballDiv.style.background = ballColor;
                        
                        const overlayImg = document.createElement('img');
                        overlayImg.src = 'https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/icons/bongbong.png';
                        overlayImg.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; border-radius:50%; pointer-events:none; z-index:2; object-fit:cover;';
                        ballDiv.appendChild(overlayImg);

                        let isHidden = hiddenBalls.some(h => h.tube === currentIndex && h.index === ballIndex);
                        if (isHidden) ballDiv.style.opacity = '0';
                        if (selectedTubeIndex === currentIndex && ballIndex === tube.length - 1 && !isHidden) ballDiv.classList.add('jump');
                        tubeDiv.appendChild(ballDiv);
                    });
                    rowDiv.appendChild(tubeDiv);
                });
                board.appendChild(rowDiv);
            });
        }

        function handleTubeClick(index) {
            initAudio(); 
            if (selectedTubeIndex === null) {
                if (tubes[index].length > 0) { selectedTubeIndex = index; playSfx('jump'); renderBoard(); }
            } else {
                if (selectedTubeIndex === index) { selectedTubeIndex = null; playSfx('drop'); renderBoard(); } 
                else {
                    let sourceTube = tubes[selectedTubeIndex]; let targetTube = tubes[index];
                    let topBall = sourceTube[sourceTube.length - 1];

                    if (targetTube.length < TUBE_CAPACITY && (targetTube.length === 0 || targetTube[targetTube.length - 1] === topBall)) {
                        const sourceRect = document.querySelector(`.tube[data-index='${selectedTubeIndex}']`).lastElementChild.getBoundingClientRect();
                        
                        undoStack.push(JSON.parse(JSON.stringify(tubes)));
                        selectedTubeIndex = null; 
                        let movingBall = sourceTube.pop(); targetTube.push(movingBall);
                        playerMoves++; document.getElementById('player-moves').innerText = playerMoves;
                        
                        let hiddenItem = { tube: index, index: targetTube.length - 1 }; hiddenBalls.push(hiddenItem); renderBoard(); 
                        
                        const targetRect = document.querySelector(`.tube[data-index='${index}']`).lastElementChild.getBoundingClientRect(); 
                        
                        const flyingBall = document.createElement('div'); flyingBall.className = 'ball';
                        flyingBall.style.position = 'fixed'; flyingBall.style.margin = '0'; flyingBall.style.background = movingBall; flyingBall.style.zIndex = '9999';
                        
                        const flyingOverlay = document.createElement('img');
                        flyingOverlay.src = 'https://raw.githubusercontent.com/andesign0499-beep/ball-sort-frontend/main/icons/bongbong.png';
                        flyingOverlay.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; border-radius:50%; pointer-events:none; z-index:2; object-fit:cover;';
                        flyingBall.appendChild(flyingOverlay);

                        const jumpHeight = Math.min(sourceRect.top, targetRect.top) - 40;
                        flyingBall.style.left = '0px'; flyingBall.style.top = '0px';
                        document.getElementById('flying-ball-container').appendChild(flyingBall);

                        const anim = flyingBall.animate([
                            { transform: `translate(${sourceRect.left}px, ${sourceRect.top}px)` },
                            { transform: `translate(${sourceRect.left}px, ${jumpHeight}px)`, easing: 'ease-out', offset: 0.25 },
                            { transform: `translate(${targetRect.left}px, ${jumpHeight}px)`, easing: 'ease-in-out', offset: 0.65 },
                            { transform: `translate(${targetRect.left}px, ${targetRect.top}px)`, easing: 'ease-in', offset: 0.85 },
                            { transform: `translate(${targetRect.left}px, ${targetRect.top - 12}px)`, easing: 'ease-out', offset: 0.92 },
                            { transform: `translate(${targetRect.left}px, ${targetRect.top}px)`, easing: 'ease-in', offset: 1.0 }
                        ], { duration: 350, fill: 'forwards' });
                        
                        anim.onfinish = () => {
                            flyingBall.remove(); playSfx('drop'); hiddenBalls = hiddenBalls.filter(h => h !== hiddenItem); renderBoard(); 
                            
                            if (!checkWin()) {
                                setTimeout(() => {
                                    checkSolvability(tubes).then(isSolvable => {
                                        if (!isSolvable) {
                                            playSfx('error');
                                            showLoseModal();
                                        } else {
                                            checkGameOver();
                                        }
                                    });
                                }, 50);
                            }
                        };
                    } else { playSfx('error'); if (targetTube.length > 0) { selectedTubeIndex = index; renderBoard(); } }
                }
            }
        }

        function undoMove() {
            playSfx('drop'); hiddenBalls = []; document.getElementById('flying-ball-container').innerHTML = ''; 
            if (undoStack.length > 0) { tubes = undoStack.pop(); selectedTubeIndex = null; playerMoves = Math.max(0, playerMoves - 1); document.getElementById('player-moves').innerText = playerMoves; renderBoard(); } 
        }

    </script>
</body>
</html>
