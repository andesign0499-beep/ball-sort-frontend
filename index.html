<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Ball Sort Magic</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lilita One', cursive; background-color: #1f140e; color: #fff; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden; user-select: none; }
        
        .header { display: flex; justify-content: space-between; width: 100%; max-width: 500px; padding: 15px 20px; box-sizing: border-box; align-items: center; }
        .logo { font-size: 24px; color: #ffd700; text-shadow: 0 2px 4px #000; }
        .info-box { font-size: 18px; color: #a3ffcc; }
        
        .level-container select { font-family: 'Lilita One', cursive; background: #ffd700; color: #000; border: 2px solid #fff; padding: 6px 12px; border-radius: 6px; font-size: 16px; cursor: pointer; }

        .board { display: flex; flex-direction: column; align-items: center; gap: 20px; flex: 1; justify-content: center; width: 100%; }
        .row { display: flex; justify-content: center; gap: 15px; }
        
        .tube { width: 45px; height: 260px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 2px 2px 22px 22px; display: flex; flex-direction: column-reverse; align-items: center; padding-bottom: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .tube.selected { border-color: #ffd700; box-shadow: 0 0 15px #ffd700; }
        
        .ball { width: 36px; height: 36px; border-radius: 50%; margin-top: 4px; box-shadow: inset -4px -4px 8px rgba(0,0,0,0.5); }
        .ball.jump { transform: translateY(-18px); }

        .footer { padding: 15px; font-size: 14px; color: #888; }
        .loading-text { font-size: 22px; color: #ffd700; margin-top: 50px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo" id="game-logo-text">Ball Sort Magic</div>
    <div class="level-container">
        LV: <select id="level-select" onchange="loadLevelData()"></select>
    </div>
    <div class="info-box">MIN: <span id="min-moves">Load...</span></div>
    <div class="info-box">MOVES: <span id="move-count">0</span></div>
</div>

<div class="board" id="game-board">
    <div class="loading-text">Đang tải màn chơi...</div>
</div>

<div class="footer">
    <span>© Ball Sort Web Game</span>
</div>

<div id="flying-ball-container" style="pointer-events: none; position: fixed; top:0; left:0; width:100%; height:100%;"></div>

<script>
    const API_URL = 'https://ball-sort-backend.onrender.com/api';
    let currentLevel = 1;
    let gameMatrix = [];
    let initialMatrix = [];
    let selectedTubeIndex = null;
    let moveCount = 0;
    let minMovesNeeded = 0;
    let customColorsList = [];

    window.onload = async () => {
        await loadGameConfig();
        const select = document.getElementById('level-select');
        for (let i = 1; i <= 80; i++) {
            select.innerHTML += `<option value="${i}">Level ${i}</option>`;
        }
        loadLevelData();
    };

    async function loadGameConfig() {
        try {
            let res = await fetch(`${API_URL}/game/config`);
            let data = await res.json();
            if (data.gameTitle) {
                document.getElementById('page-title').innerText = data.gameTitle;
                document.getElementById('game-logo-text').innerText = data.gameTitle;
            }
            if (data.customColors && Array.isArray(data.customColors)) {
                customColorsList = data.customColors;
            }
        } catch (e) {}
    }

    async function loadLevelData() {
        currentLevel = parseInt(document.getElementById('level-select').value);
        document.getElementById('min-moves').innerText = "Load...";
        document.getElementById('game-board').innerHTML = `<div class="loading-text">Đang tải màn chơi...</div>`;
        
        try {
            let res = await fetch(`${API_URL}/game/level/${currentLevel}`);
            let data = await res.json();
            
            if (data && data.matrix) {
                initialMatrix = JSON.parse(JSON.stringify(data.matrix));
                gameMatrix = JSON.parse(JSON.stringify(data.matrix));
                minMovesNeeded = data.metrics ? data.metrics.minMoves : 0;
                document.getElementById('min-moves').innerText = minMovesNeeded;
                moveCount = 0;
                document.getElementById('move-count').innerText = moveCount;
                selectedTubeIndex = null;
                renderBoard();
            } else {
                document.getElementById('game-board').innerHTML = `<div class="loading-text" style="color: #ff5252;">CHƯA CÓ LEVEL NÀO ĐƯỢC TẠO!<br><span style="font-size:14px; color:#aaa;">Hãy vào trang Admin CMS để tạo màn chơi đầu tiên.</span></div>`;
            }
        } catch (e) {
            document.getElementById('game-board').innerHTML = `<div class="loading-text" style="color: #ff5252;">Lỗi kết nối Server!</div>`;
        }
    }

    function renderBoard() {
        const board = document.getElementById('game-board');
        board.innerHTML = '';
        const numTubes = gameMatrix.length;
        const topCount = Math.ceil(numTubes / 2);
        const rows = [ gameMatrix.slice(0, topCount), gameMatrix.slice(topCount) ];
        
        let globalIdx = 0;
        rows.forEach(rowTubes => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            rowTubes.forEach(tube => {
                let tubeIdx = globalIdx++;
                const tubeDiv = document.createElement('div');
                tubeDiv.className = `tube ${selectedTubeIndex === tubeIdx ? 'selected' : ''}`;
                tubeDiv.onclick = () => handleTubeClick(tubeIdx);
                
                tube.forEach((ballColor, ballIdx) => {
                    const ballDiv = document.createElement('div');
                    ballDiv.className = 'ball';
                    ballDiv.style.background = ballColor.startsWith('#') ? `radial-gradient(circle at 35% 35%, ${ballColor} 0%, #000 80%)` : ballColor;
                    if (selectedTubeIndex === tubeIdx && ballIdx === tube.length - 1) {
                        ballDiv.classList.add('jump');
                    }
                    tubeDiv.appendChild(ballDiv);
                });
                rowDiv.appendChild(tubeDiv);
            });
            board.appendChild(rowDiv);
        });
    }

    function handleTubeClick(index) {
        if (selectedTubeIndex === null) {
            if (gameMatrix[index].length > 0) {
                selectedTubeIndex = index;
                renderBoard();
            }
        } else {
            if (selectedTubeIndex === index) {
                selectedTubeIndex = null;
                renderBoard();
            } else {
                let srcTube = gameMatrix[selectedTubeIndex];
                let destTube = gameMatrix[index];
                let topBall = srcTube[srcTube.length - 1];
                const TUBE_CAPACITY = 6;

                if (destTube.length < TUBE_CAPACITY && (destTube.length === 0 || destTube[destTube.length - 1] === topBall)) {
                    selectedTubeIndex = null;
                    let movingBall = srcTube.pop();
                    destTube.push(movingBall);
                    moveCount++;
                    document.getElementById('move-count').innerText = moveCount;
                    renderBoard();
                    checkWinCondition();
                } else {
                    selectedTubeIndex = index;
                    renderBoard();
                }
            }
        }
    }

    function checkWinCondition() {
        let isWon = gameMatrix.every(tube => tube.length === 0 || (tube.length === 6 && new Set(tube).size === 1));
        if (isWon) {
            setTimeout(() => {
                alert(`🎉 Chúc mừng bạn đã vượt qua Level ${currentLevel}!`);
                if (currentLevel < 80) {
                    document.getElementById('level-select').value = currentLevel + 1;
                    loadLevelData();
                }
            }, 100);
        }
    }
</script>

</body>
</html>
