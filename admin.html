<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Sort - Admin CMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1f140e; color: #fff; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;}
        
        /* TOP BAR */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(0,0,0,0.6); border-bottom: 2px solid #d4af37; }
        .logo { font-family: 'Lilita One', cursive; font-size: 28px; color: #ffd700; text-shadow: 0 2px 4px #000; }
        .game-title-editor { display: flex; align-items: center; gap: 10px; background: #333; padding: 5px 15px; border-radius: 8px; }
        .game-title-editor input { padding: 8px; border: 1px solid #555; border-radius: 4px; background: #222; color: #fff; font-size: 14px; width: 200px;}
        .game-title-editor button { background: #0f9d58; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .level-selector select { font-family: 'Lilita One', cursive; background: #fff; color: #000; border: 2px solid #d4af37; padding: 8px 15px; border-radius: 4px; font-size: 16px; cursor: pointer; width: 120px; }

        /* MAIN LAYOUT */
        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        /* CỘT TRÁI (Biên tập) */
        .editor-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; background-image: linear-gradient(90deg, rgba(0,0,0,0.7) 2px, transparent 2px, transparent 98px, rgba(255,255,255,0.02) 98px, rgba(255,255,255,0.02) 100px); }
        
        .empty-state { display: flex; justify-content: center; align-items: center; flex: 1; }
        .btn-create-board { background: #d4af37; color: #3e2700; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; font-weight: bold; border-radius: 4px; font-family: 'Segoe UI', sans-serif; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        .board-state { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; padding-top: 40px; box-sizing: border-box; overflow-y: auto;}
        .game-info { display: flex; gap: 30px; color: #fff; font-size: 24px; margin-bottom: 30px; font-family: 'Lilita One', cursive;}
        .board { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 20px; width: 100%; }
        .row { display: flex; justify-content: center; gap: 10px; }
        .tube { width: 40px; height: 240px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 2px 2px 20px 20px; display: flex; flex-direction: column-reverse; align-items: center; padding-bottom: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent;}
        .tube.selected { border-color: #ffd700; box-shadow: 0 0 12px #ffd700; }
        .ball { width: 32px; height: 32px; border-radius: 50%; margin-top: 4px; box-shadow: inset -4px -4px 8px rgba(0,0,0,0.5); }
        .ball.jump { transform: translateY(-16px); }

        .action-buttons { display: flex; gap: 20px; margin-top: 30px; margin-bottom: 40px;}
        .btn-regenerate { background: #cc0000; color: #fff; border: none; padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 4px; }
        .btn-save-slot { background: #00aa00; color: #fff; border: none; padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 4px; }

        /* CỘT PHẢI (Danh sách 6 Slot) */
        .sidebar { width: 350px; background: #1a110c; border-left: 2px solid #333; padding: 25px; display: flex; flex-direction: column; }
        .sidebar-header { display: flex; justify-content: space-between; color: #aaa; font-size: 14px; margin-bottom: 20px; padding: 0 10px; }
        .slot-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; cursor: pointer; }
        .slot-btn { width: 110px; padding: 12px; text-align: center; background: #333; color: #aaa; border-radius: 4px; font-size: 15px; transition: 0.2s;}
        .slot-item.active .slot-btn { background: #fff; color: #000; font-weight: bold; }
        .slot-status { flex: 1; text-align: left; padding-left: 25px; font-size: 14px; }
        .status-empty { color: #666; }
        .status-saved { color: #0f9d58; }

        #toast { position: fixed; top: 80px; right: 20px; background: #0f9d58; color: white; padding: 15px 25px; border-radius: 8px; font-weight: bold; font-size: 16px; display: none; z-index: 2000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="logo">Level Inspector</div>
    <div class="game-title-editor">
        Tên Game: 
        <input type="text" id="game-title" placeholder="Ball Sort Magic">
        <button onclick="saveConfig()">Lưu Tên</button>
    </div>
    <div class="level-selector">
        <select id="main-level-select" onchange="onLevelChange()"></select>
    </div>
</div>

<div class="main-content">
    <div class="editor-area">
        <div id="empty-state" class="empty-state">
            <button class="btn-create-board" onclick="generateAndSolveBoard()">Creat new board</button>
        </div>
        
        <div id="board-state" class="board-state">
            <div class="game-info">
                <span>MIN MOVES: <span id="info-min-moves" style="color: #a3ffcc;">Calc...</span></span>
                <span>TEST MOVES: <span id="info-play-moves" style="color: #ffd700;">0</span></span>
            </div>
            <div class="board" id="admin-board"></div>
            <div class="action-buttons">
                <button class="btn-regenerate" onclick="generateAndSolveBoard()">Đổi màn chơi khác</button>
                <button id="btn-save-level" class="btn-save-slot" onclick="saveCurrentSlot()">Cho hiển thị ngẫu nhiên</button>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>Saved board:</span>
            <span style="flex:1; text-align: left; padding-left: 25px;">Trạng thái</span>
        </div>
        <div id="slots-container"></div>
    </div>
</div>

<div id="toast">✅ Saved successfully!</div>
<div id="flying-ball-container" style="pointer-events: none;"></div>

<script>
    const API_URL = 'https://ball-sort-backend.onrender.com/api';
    const COLORS = [
        'radial-gradient(circle at 35% 35%, #ff5252 0%, #b71c1c 70%, #5f0f0f 100%)', 'radial-gradient(circle at 35% 35%, #448aff 0%, #1565c0 70%, #0d3b66 100%)',
        'radial-gradient(circle at 35% 35%, #76ff03 0%, #558b2f 70%, #274e13 100%)', 'radial-gradient(circle at 35% 35%, #ffd740 0%, #ff8f00 70%, #8d4e00 100%)',
        'radial-gradient(circle at 35% 35%, #e040fb 0%, #7b1fa2 70%, #380d4c 100%)', 'radial-gradient(circle at 35% 35%, #ffab40 0%, #e65100 70%, #7c2d0c 100%)',
        'radial-gradient(circle at 35% 35%, #90a4ae 0%, #455a64 70%, #212121 100%)', 'radial-gradient(circle at 35% 35%, #ff80df 0%, #ec407a 70%, #880e4f 100%)',
        'radial-gradient(circle at 35% 35%, #cfd8dc 0%, #607d8b 70%, #263238 100%)', 'radial-gradient(circle at 35% 35%, #81c784 0%, #2e7d32 70%, #1b5e20 100%)',
        'radial-gradient(circle at 35% 35%, #546e7a 0%, #37474f 70%, #102027 100%)', 'radial-gradient(circle at 35% 35%, #e91e63 0%, #880e4f 100%, #310015 100%)'
    ];
    const TUBE_CAPACITY = 6;

    let currentLevelNum = 1; let currentSlotIndex = 1; let slotsData = {}; 
    let currentMatrix = []; let initialMatrix = []; let computedMinMoves = null;
    let selectedTube = null; let playtestMoves = 0; let hiddenBalls = [];

    // HỆ THỐNG ÂM THANH CHO ADMIN Y NHƯ GAME GỐC
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    document.body.addEventListener('pointerdown', initAudio, {once: true});
    function playSfx(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
        if (type === 'jump') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); } 
        else if (type === 'drop') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); } 
        else if (type === 'error') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2); } 
    }

    window.onload = () => {
        const select = document.getElementById('main-level-select');
        for (let i = 1; i <= 80; i++) { select.innerHTML += `<option value="${i}">Level ${i}</option>`; }
        loadConfig(); onLevelChange();
    };

    async function loadConfig() {
        try {
            let res = await fetch(`${API_URL}/game/config`);
            let data = await res.json();
            document.getElementById('game-title').value = data.gameTitle || '';
        } catch (e) {}
    }
    
    async function saveConfig() {
        let title = document.getElementById('game-title').value;
        try {
            await fetch(`${API_URL}/admin/config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ gameTitle: title, showTitle: true }) });
            showToast("Đã lưu Tên trò chơi!");
        } catch (e) { alert("Lỗi kết nối Server"); }
    }

    async function onLevelChange() {
        currentLevelNum = parseInt(document.getElementById('main-level-select').value);
        slotsData = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null };
        try {
            let res = await fetch(`${API_URL}/admin/levels/list/${currentLevelNum}`);
            let data = await res.json();
            data.forEach(lvl => { if(lvl.slot >= 1 && lvl.slot <= 6) slotsData[lvl.slot] = lvl; });
        } catch (e) {}
        selectSlot(1); 
    }

    function renderSidebar() {
        const container = document.getElementById('slots-container');
        container.innerHTML = '';
        for (let i = 1; i <= 6; i++) {
            let isCreated = slotsData[i] !== null;
            let statusText = isCreated ? "Hiển thị ngẫu nhiên" : "Chưa tạo";
            let statusClass = isCreated ? "status-saved" : "status-empty";
            let isActiveClass = (i === currentSlotIndex) ? "active" : "";
            
            container.innerHTML += `
                <div class="slot-item ${isActiveClass}" onclick="selectSlot(${i})">
                    <div class="slot-btn">Save 0${i}</div>
                    <div class="slot-status ${statusClass}">${statusText}</div>
                </div>
            `;
        }
    }

    function selectSlot(index) {
        currentSlotIndex = index; renderSidebar();
        let data = slotsData[index];
        if (data === null) {
            document.getElementById('empty-state').style.display = 'flex';
            document.getElementById('board-state').style.display = 'none';
        } else {
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('board-state').style.display = 'flex';
            initialMatrix = JSON.parse(JSON.stringify(data.matrix)); currentMatrix = JSON.parse(JSON.stringify(data.matrix));
            computedMinMoves = data.metrics ? data.metrics.minMoves : null;
            resetBoardState();
        }
    }

    function generateAndSolveBoard() {
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('board-state').style.display = 'flex';
        
        let numTubes, shuffleSteps;
        if (currentLevelNum <= 15) { numTubes = (currentLevelNum <= 7) ? 7 : 8; shuffleSteps = 150 + currentLevelNum * 20; }
        else if (currentLevelNum <= 35) { numTubes = (currentLevelNum <= 25) ? 9 : 10; shuffleSteps = 500 + (currentLevelNum - 15) * 35; }
        else if (currentLevelNum <= 60) { numTubes = (currentLevelNum <= 48) ? 11 : 12; shuffleSteps = 1200 + (currentLevelNum - 35) * 50; }
        else { numTubes = (currentLevelNum <= 70) ? 13 : 14; shuffleSteps = 2200 + (currentLevelNum - 60) * 80; }
        
        let numColors = numTubes - 2; let tubes = [];
        for (let i = 0; i < numTubes; i++) {
            let tube = [];
            if (i < numColors) { for (let j = 0; j < TUBE_CAPACITY; j++) tube.push(COLORS[i % COLORS.length]); }
            tubes.push(tube);
        }
        
        let prevSrc = -1, prevDest = -1;
        for (let step = 0; step < shuffleSteps; step++) {
            let validMoves = [];
            for (let i = 0; i < numTubes; i++) {
                if (tubes[i].length > 0) {
                    for (let j = 0; j < numTubes; j++) {
                        if (i !== j && tubes[j].length < TUBE_CAPACITY && !(i === prevDest && j === prevSrc)) validMoves.push({src: i, dest: j});
                    }
                }
            }
            if (validMoves.length > 0) {
                let move = validMoves[Math.floor(Math.random() * validMoves.length)];
                tubes[move.dest].push(tubes[move.src].pop()); prevSrc = move.src; prevDest = move.dest;
            } else break;
        }

        currentMatrix = JSON.parse(JSON.stringify(tubes)); initialMatrix = JSON.parse(JSON.stringify(tubes)); 
        computedMinMoves = null; resetBoardState();
    }

    function resetBoardState() {
        playtestMoves = 0; document.getElementById('info-play-moves').innerText = playtestMoves;
        selectedTube = null; hiddenBalls = []; renderAdminBoard();
        document.getElementById('info-min-moves').innerText = computedMinMoves !== null ? computedMinMoves : "Calc...";
        document.getElementById('info-min-moves').style.color = computedMinMoves !== null ? "#a3ffcc" : "orange";
        document.getElementById('btn-save-level').disabled = true;

        if (computedMinMoves === null) {
            setTimeout(() => {
                calculateMinMoves(initialMatrix).then(minMoves => {
                    computedMinMoves = minMoves;
                    if(minMoves === null) {
                        document.getElementById('info-min-moves').innerText = "Complex"; document.getElementById('info-min-moves').style.color = "red";
                    } else {
                        document.getElementById('info-min-moves').innerText = minMoves; document.getElementById('info-min-moves').style.color = "#a3ffcc"; document.getElementById('btn-save-level').disabled = false;
                    }
                });
            }, 50);
        } else { document.getElementById('btn-save-level').disabled = false; }
    }

    function getCanonicalSignature(state) {
        let copies = state.map(t => [...t]); copies.sort((a, b) => a.join(',').localeCompare(b.join(','))); return JSON.stringify(copies);
    }
    
    // ĐÃ FIX: Bổ sung lệnh chống treo (đơ) trình duyệt khi AI tính đường đi của Admin
    async function calculateMinMoves(stateMatrix) {
        let queue = [{ state: JSON.parse(JSON.stringify(stateMatrix)), dist: 0 }];
        let visited = new Set(); visited.add(getCanonicalSignature(stateMatrix));
        let iterations = 0;

        while (queue.length > 0) {
            if (iterations % 1000 === 0) {
                await new Promise(resolve => setTimeout(resolve, 0)); // Chống đơ trình duyệt
            }
            if (iterations++ > 150000) return null; 
            
            let { state, dist } = queue.shift();
            let isWon = state.every(t => t.length === 0 || (t.length === TUBE_CAPACITY && new Set(t).size === 1));
            if (isWon) return dist;

            for (let i = 0; i < state.length; i++) {
                if (state[i].length === 0) continue;
                let topColor = state[i][state[i].length - 1];
                for (let j = 0; j < state.length; j++) {
                    if (i === j) continue;
                    let target = state[j];
                    if (TUBE_CAPACITY - target.length > 0 && (target.length === 0 || target[target.length - 1] === topColor)) {
                        let nextState = JSON.parse(JSON.stringify(state));
                        while (nextState[i].length > 0 && nextState[i][nextState[i].length - 1] === topColor && nextState[j].length < TUBE_CAPACITY) { nextState[j].push(nextState[i].pop()); }
                        let sig = getCanonicalSignature(nextState);
                        if (!visited.has(sig)) { visited.add(sig); queue.push({ state: nextState, dist: dist + 1 }); }
                    }
                }
            }
        }
        return null;
    }

    function renderAdminBoard() {
        const board = document.getElementById('admin-board'); board.innerHTML = '';
        const numTubes = currentMatrix.length; const topCount = Math.ceil(numTubes / 2);
        const rows = [ currentMatrix.slice(0, topCount), currentMatrix.slice(topCount) ];
        
        let globalIndex = 0;
        rows.forEach((rowTubes) => {
            if (rowTubes.length === 0) return;
            const rowDiv = document.createElement('div'); rowDiv.className = 'row';
            rowTubes.forEach((tube) => {
                let currentIndex = globalIndex++; const tubeDiv = document.createElement('div');
                tubeDiv.className = `tube ${selectedTube === currentIndex ? 'selected' : ''}`;
                tubeDiv.setAttribute('data-index', currentIndex);
                tubeDiv.onclick = () => handleTubeClick(currentIndex);
                
                tube.forEach((ballColor, ballIndex) => {
                    const ballDiv = document.createElement('div'); ballDiv.className = 'ball'; ballDiv.style.background = ballColor;
                    let isHidden = hiddenBalls.some(h => h.tube === currentIndex && h.index === ballIndex);
                    if (isHidden) ballDiv.style.opacity = '0';
                    if (selectedTube === currentIndex && ballIndex === tube.length - 1 && !isHidden) ballDiv.classList.add('jump');
                    tubeDiv.appendChild(ballDiv);
                });
                rowDiv.appendChild(tubeDiv);
            });
            board.appendChild(rowDiv);
        });
    }

    function animateBallRealistic(startRect, endRect, ballColor, callback) {
        const flyingBall = document.createElement('div'); flyingBall.className = 'ball';
        flyingBall.style.position = 'fixed'; flyingBall.style.margin = '0'; flyingBall.style.background = ballColor; flyingBall.style.zIndex = '9999';
        
        const jumpHeight = Math.min(startRect.top, endRect.top) - 40;
        flyingBall.style.left = '0px'; flyingBall.style.top = '0px';
        document.getElementById('flying-ball-container').appendChild(flyingBall);

        const anim = flyingBall.animate([
            { transform: `translate(${startRect.left}px, ${startRect.top}px)` },
            { transform: `translate(${startRect.left}px, ${jumpHeight}px)`, easing: 'ease-out', offset: 0.25 },
            { transform: `translate(${endRect.left}px, ${jumpHeight}px)`, easing: 'ease-in-out', offset: 0.65 },
            { transform: `translate(${endRect.left}px, ${endRect.top}px)`, easing: 'ease-in', offset: 0.85 },
            { transform: `translate(${endRect.left}px, ${endRect.top - 12}px)`, easing: 'ease-out', offset: 0.92 },
            { transform: `translate(${endRect.left}px, ${endRect.top}px)`, easing: 'ease-in', offset: 1.0 }
        ], { duration: 350, fill: 'forwards' });
        
        anim.onfinish = () => { flyingBall.remove(); callback(); };
    }

    function handleTubeClick(index) {
        initAudio();
        if (selectedTube === null) {
            if (currentMatrix[index].length > 0) { selectedTube = index; playSfx('jump'); renderAdminBoard(); }
        } else {
            if (selectedTube === index) { selectedTube = null; playSfx('drop'); renderAdminBoard(); } 
            else {
                let sourceTube = currentMatrix[selectedTube]; let targetTube = currentMatrix[index];
                let topBall = sourceTube[sourceTube.length - 1];

                if (targetTube.length < TUBE_CAPACITY && (targetTube.length === 0 || targetTube[targetTube.length - 1] === topBall)) {
                    const sourceRect = document.querySelector(`.tube[data-index='${selectedTube}']`).lastElementChild.getBoundingClientRect();
                    
                    selectedTube = null; 
                    let movingBall = sourceTube.pop(); targetTube.push(movingBall);
                    playtestMoves++; document.getElementById('info-play-moves').innerText = playtestMoves;
                    
                    let hiddenItem = { tube: index, index: targetTube.length - 1 };
                    hiddenBalls.push(hiddenItem);
                    
                    renderAdminBoard(); 
                    
                    const targetRect = document.querySelector(`.tube[data-index='${index}']`).lastElementChild.getBoundingClientRect(); 
                    
                    animateBallRealistic(sourceRect, targetRect, movingBall, () => {
                        playSfx('drop');
                        hiddenBalls = hiddenBalls.filter(h => h !== hiddenItem);
                        renderAdminBoard(); 
                    });
                } else { playSfx('error'); selectedTube = index; renderAdminBoard(); }
            }
        }
    }

    function showToast(msg) { let toast = document.getElementById('toast'); toast.innerText = msg; toast.style.display = 'block'; setTimeout(() => toast.style.display = 'none', 2500); }

    async function saveCurrentSlot() {
        document.getElementById('btn-save-level').disabled = true;
        try {
            await fetch(`${API_URL}/admin/levels`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ matrix: initialMatrix, levelNum: currentLevelNum, slotNum: currentSlotIndex, minMoves: computedMinMoves })
            });
            slotsData[currentSlotIndex] = { matrix: initialMatrix, metrics: { minMoves: computedMinMoves } };
            renderSidebar();
            showToast(`✅ Đã lưu thành công vào Save 0${currentSlotIndex}!`);
            document.getElementById('btn-save-level').disabled = false;
        } catch (error) { alert("❌ Lỗi kết nối Server."); document.getElementById('btn-save-level').disabled = false; }
    }
</script>

</body>
</html>
