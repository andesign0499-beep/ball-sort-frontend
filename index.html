<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Magic - Sort Puzzle</title>
    <script src="https://connect.facebook.net/en_US/fbinstant.6.3.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Relief:wght@700&display=swap');

        :root {
            --bg-color: #1f140e;
            --bg-pattern: url('./assets/bg.jpg');
            --bg-size: auto; 
            --tube-border: rgba(255, 255, 255, 0.3);
            --tube-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; font-family: "Comic Relief", system-ui; font-weight: 700; color: #fff; overflow: hidden; touch-action: manipulation;
            background-color: var(--bg-color);
            background-image: var(--bg-pattern);
            background-size: var(--bg-size);
            background-repeat: repeat;
        }

        #game-logo-img {
            height: 56px; width: auto; object-fit: contain; margin: 4px 0 4px 0;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); display: none;
        }

        /* ================= MUTE BUTTON ================= */
        #btn-mute { 
            position: absolute; top: 16px; right: 16px; z-index: 1000; 
            width: 40px; height: 40px; 
            background: transparent; border: none; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; padding: 0;
            -webkit-tap-highlight-color: transparent; transition: transform 0.1s ease;
        }
        #btn-mute:active { transform: scale(0.85); }
        #btn-mute img { width: 24px; height: 24px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }

        /* ================= HEADER (DẠNG CAPSULE 44px) ================= */
        .header-section { 
            width: 100%; display: flex; flex-direction: column; align-items: center; 
            margin-bottom: 20px; padding-top: 8px; z-index: 10; 
        }
        
        .game-info-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            width: calc(100% - 32px); max-width: 460px; height: 44px; 
            background-color: rgba(0, 0, 0, 0.32); border-radius: 22px; 
            padding: 0 8px; box-sizing: border-box; font-family: "Comic Relief", system-ui; font-weight: 700;
        }

        .info-group { display: flex; align-items: center; gap: 4px; }
        .icon-circle { width: 24px; height: 24px; background-color: rgba(255, 255, 255, 0.08); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .icon-circle img { width: 20px; height: 20px; object-fit: contain; filter: brightness(0) invert(1); }
        
        .text-col { display: flex; flex-direction: column; justify-content: center; }
        .text-right { align-items: flex-end; text-align: right; }
        
        .text-col .label { color: #ffd700; font-size: 12px; font-weight: 700; line-height: 1; margin-bottom: 2px; }
        .text-col .value { color: #ffffff; font-size: 16px; font-weight: 700; line-height: 1; transition: color 0.3s ease; }
        .text-col .value.perfect { color: #ff33cc; }

        .action-group { display: flex; align-items: center; gap: 8px; }
        
        .btn-action {
            width: 36px; height: 36px; background-color: transparent; background-image: url('./assets/icon/bt_retune.png');
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
            border: none; outline: none; cursor: pointer; transition: transform 0.1s; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            padding: 0; display: flex; align-items: center; justify-content: center;
        }
        .btn-action img { width: 20px; height: 20px; object-fit: contain; filter: brightness(0) invert(1); }
        .btn-action:active { transform: scale(0.85); }

        .level-select-custom { 
            background-color: transparent; background-image: url('./assets/icon/bt_level.png'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center;
            border: none; outline: none; width: 104px; height: 40px; color: #3e2700; font-family: "Comic Relief", system-ui; font-weight: 700; font-size: 16px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 4px 0 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); transition: transform 0.1s;
        }
        .level-select-custom:active { transform: scale(0.95); }

        /* ================= BÀN CHƠI ================= */
        #game-screen { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; height: 100dvh; padding: 8px 0; box-sizing: border-box; }
        .board-section { flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 0;}

        .board { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 100vw; padding: 0; box-sizing: border-box; }
        .row { display: flex; justify-content: center; gap: 12px; width: 100%; }
        
        .tube {
            width: 40px; height: 240px; border-radius: 4px 4px 20px 20px; display: flex; flex-direction: column-reverse; align-items: center; padding-bottom: 8px; position: relative; cursor: pointer; 
            box-shadow: inset 0 -8px 16px rgba(0,0,0,0.5); -webkit-tap-highlight-color: transparent; transition: box-shadow 0.3s ease, border-color 0.3s ease;
            background: var(--tube-bg); border: 2px solid var(--tube-border);
        }
        .tube.selected { border-color: #ffd700; box-shadow: 0 0 12px #ffd700, inset 0 -8px 16px rgba(0,0,0,0.5); }
        .tube.completed-magic { border-color: #00ffff; box-shadow: 0 0 20px #00ffff, inset 0 -8px 16px rgba(0,255,255,0.4); animation: pulseGlow 1.5s infinite alternate; }
        
        .ball { position: relative; width: 32px; height: 32px; border-radius: 50%; margin-top: 4px; box-shadow: inset -4px -4px 8px rgba(0,0,0,0.5); }
        .ball.jump { transform: translateY(-16px); }

        /* HIỆU ỨNG VẬT LÝ NHÚN BÓNG (SQUASH) */
        .ball.squash {
            animation: squashAnim 0.15s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: bottom center;
        }
        @keyframes squashAnim {
            0% { transform: scale(1, 1); }
            50% { transform: scale(1.2, 0.8) translateY(2px); }
            100% { transform: scale(1, 1); }
        }

        .board.compact { gap: 16px; }
        .board.compact .row { gap: 8px; }
        .board.compact .tube { width: 36px; height: 216px; border-radius: 4px 4px 16px 16px; padding-bottom: 8px; }
        .board.compact .ball { width: 28px; height: 28px; margin-top: 4px; }
        .board.compact .ball.jump { transform: translateY(-16px); }

        @keyframes pulseGlow { 0% { box-shadow: 0 0 8px #00ffff, inset 0 -8px 16px rgba(0,255,255,0.4); } 100% { box-shadow: 0 0 24px #ff77ff, inset 0 -8px 16px rgba(255,119,255,0.6); } }

        /* ================= GIAO DIỆN MODALS ================= */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 2000; justify-content: center; align-items: center; padding: 8px; box-sizing: border-box; }
        
        .modal-orb {
            width: 352px; height: 352px; background-image: url('./assets/icon/popup-bg.png'); background-size: contain; background-position: center; background-repeat: no-repeat;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative;
            font-family: "Comic Relief", system-ui; font-weight: 700; filter: drop-shadow(0 24px 40px rgba(0,0,0,0.9)); 
        }

        .popup-stars-container { position: absolute; top: -16px; display: flex; justify-content: center; gap: 8px; width: 100%; pointer-events: none; z-index: 10; }
        .popup-star { width: 40px; height: 40px; background-image: url('./assets/icon/icon_star.png'); background-size: contain; background-repeat: no-repeat; background-position: center; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8)); }
        .popup-star.half { background-image: url('./assets/icon/icon_star_12.png'); }
        .popup-stars-container.count-3 .popup-star:nth-child(2) { transform: translateY(-8px); }

        .modal-title-img { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 80%; height: auto; object-fit: contain; pointer-events: none; }

        /* CĂN CHỈNH LẠI POPUP WIN/LOSE */
        .modal-content-area { margin-top: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #4a2f1d; width: 100%; }
        .modal-subtitle { font-size: 18px; font-weight: 700; margin-bottom: 0px; line-height: 1.3;}
        .score-large { font-size: 72px; color: #e65134; margin: 0 0 8px 0; line-height: 1; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }
        .score-small { font-size: 14px; margin: 2px 0; font-weight: 700;}
        
        .val-blue { color: #3baaf8; }
        .val-orange { color: #e65134; }
        .text-magenta { color: #ff33cc; }

        .modal-buttons { display: flex; gap: 12px; margin-top: 16px; justify-content: center; width: 100%; }
        
        .btn-custom {
            background-color: transparent; border: none; outline: none; background-size: contain; background-repeat: no-repeat; background-position: center;
            width: 144px; height: 48px; color: white; font-family: "Comic Relief", system-ui; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: transform 0.1s; letter-spacing: 0.5px; -webkit-text-stroke: 2px rgba(0,0,0,0.68); paint-order: stroke fill;
        }
        .btn-custom:active { transform: scale(0.92); }
        .btn-blue { background-image: url('./assets/icon/bt_blue.png'); }
        .btn-green { background-image: url('./assets/icon/bt_green.png'); }

        /* ================= HIỆU ỨNG PHÁO GIẤY ================= */
        .confetti {
            position: fixed; width: 8px; height: 16px; z-index: 9999; top: -24px; pointer-events: none;
            animation: confettiFall linear forwards; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10vh) rotate(0deg) rotateX(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg) rotateX(360deg); opacity: 0; }
        }

        /* ================= Modal Chọn Level ================= */
        .level-modal-box {
            width: 100%; max-width: 460px; max-height: 704px; background-color: var(--bg-color); background-image: var(--bg-pattern); background-size: var(--bg-size);
            border: 2px solid #ffb22a; border-radius: 32px; padding: 16px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; box-shadow: 0 16px 40px rgba(0,0,0,0.8);
        }
        .level-modal-title { font-size: 24px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin: 0 0 16px 0; }
        .level-grid-wrapper { width: 100%; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 100%); border-radius: 24px; box-sizing: border-box; margin-bottom: 0px; padding: 12px; }
        .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px 8px; max-height: 448px; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; padding-top: 16px; }
        .level-grid::-webkit-scrollbar { display: none; }
        .level-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.1s; }
        .level-item:active { transform: scale(0.9); }
        .level-icon { width: 48px; height: 48px; background-size: contain; background-repeat: no-repeat; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; margin-bottom: 4px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)); line-height: 1; }
        .level-icon-active { background-image: url('./assets/icon/bg_level_active.png'); color: #000; }
        .level-icon-none { background-image: url('./assets/icon/bg_level_none.png'); color: #fff; }
        .level-icon-min { background-image: url('./assets/icon/bg_level_min.png'); color: #fff; }
        .level-text { font-size: 12px; color: #fff; white-space: nowrap; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-top: 4px;}
        .level-text.perfect { color: #ff33cc; }
        .stars-container { position: absolute; display: flex; justify-content: center; gap: -2px; width: 100%; pointer-events: none; z-index: 2; top: -8px; }
        .star { width: 16px; height: 16px; background-image: url('./assets/icon/icon_star.png'); background-size: contain; background-repeat: no-repeat; background-position: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        .star.half { background-image: url('./assets/icon/icon_star_12.png'); }
        .stars-container.count-3 .star:nth-child(2) { transform: translateY(-4px); }
        .stars-container.count-2 .star:nth-child(1) { transform: rotate(-8deg); }
        .stars-container.count-2 .star:nth-child(2) { transform: rotate(8deg); }
        .level-modal-box .btn-green { margin-bottom: -40px; } 

        /* ================= HIỆU ỨNG ÁNH SÁNG NỀN ================= */
        body::before, body::after { content: ""; position: fixed; border-radius: 50%; filter: blur(60px); z-index: 0; pointer-events: none; will-change: transform; }
        body::before { top: -10vh; left: -20vw; width: 70vw; height: 70vw; background: radial-gradient(circle, rgba(180, 40, 255, 0.25) 0%, transparent 70%); animation: floatLightMagenta 12s infinite alternate ease-in-out; }
        body::after { bottom: -20vh; right: -20vw; width: 80vw; height: 80vw; background: radial-gradient(circle, rgba(0, 200, 255, 0.2) 0%, transparent 70%); animation: floatLightCyan 15s infinite alternate ease-in-out; }
        @keyframes floatLightMagenta { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40vw, 30vh) scale(1.3); } }
        @keyframes floatLightCyan { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-30vw, -20vh) scale(1.2); } }

    </style>
</head>
<body>

    <button id="btn-mute" onclick="toggleMute()">
        <img id="mute-icon" src="./assets/icon/volume-max.svg" alt="Volume">
    </button>

    <div id="game-screen">
        <img id="game-logo-img" src="./assets/logo_ballmagic.png" alt="Ball Magic Logo">
        
        <div class="header-section">
            <div class="game-info-bar">
                <!-- CỤM TRÁI: Best -->
                <div class="info-group">
                    <div class="icon-circle"><img src="./assets/icon/cup.svg" alt="Best"></div>
                    <div class="text-col">
                        <span class="label">Best</span>
                        <span class="value" id="best-moves">...</span>
                    </div>
                </div>

                <!-- CỤM GIỮA: Điều khiển -->
                <div class="action-group">
                    <button id="btn-undo" class="btn-action" onclick="undoMove()">
                        <img src="./assets/icon/retune.svg" alt="Undo">
                    </button>
                    <button id="level-btn" class="level-select-custom" onclick="openLevelModal()">Level 1</button>
                    <button id="btn-restart" class="btn-action" onclick="restartLevel()">
                        <img src="./assets/icon/reset.svg" alt="Restart">
                    </button>
                </div>

                <!-- CỤM PHẢI: Moves -->
                <div class="info-group right">
                    <div class="text-col text-right">
                        <span class="label">Moves</span>
                        <span class="value" id="player-moves">0</span>
                        <span id="min-moves" style="display:none;">...</span>
                    </div>
                    <div class="icon-circle"><img src="./assets/icon/star.svg" alt="Star"></div>
                </div>
            </div>
        </div>
        
        <div class="board-section">
            <div class="board" id="board"></div>
        </div>
    </div>

    <!-- Modal Level Select -->
    <div id="level-select-modal" class="modal-overlay">
        <div class="level-modal-box">
            <h2 class="level-modal-title">Choose level and play</h2>
            <div class="level-grid-wrapper">
                <div class="level-grid" id="level-grid"></div>
            </div>
            <button class="btn-custom btn-green" onclick="closeLevelModal()">CLOSE</button>
        </div>
    </div>

    <!-- Modal Popup Win/Lose/Perfect -->
    <div id="result-modal" class="modal-overlay">
        <div class="modal-orb">
            <div id="popup-stars" class="popup-stars-container"></div>
            <img id="modal-title-img" src="" class="modal-title-img">
            <div class="modal-content-area">
                <div id="modal-subtitle" class="modal-subtitle"></div>
                <div id="modal-score" class="score-large"></div>
                <div id="modal-metrics-box">
                    <!-- ĐÃ SỬA LẠI: Chữ giữ nguyên màu mặc định, chỉ có số mới mang class màu tím -->
                    <div class="score-small">Min Moves level <span id="modal-lvl-text"></span>: <span id="modal-min-moves-box" class="text-magenta"></span></div>
                    <div class="score-small">Best Moves: <span id="modal-best-moves" class="val-orange"></span></div>
                </div>
                <div class="modal-buttons">
                    <button id="modal-btn-left" class="btn-custom btn-blue"></button>
                    <button id="modal-btn-right" class="btn-custom btn-green"></button>
                </div>
            </div>
        </div>
    </div>

    <div id="flying-ball-container"></div>

    <script>
        let gameData = null;
        let currentLevel = parseInt(localStorage.getItem('ballmagic_current_level')) || 1;
        let tubes = []; let initialTubesState = []; let undoStack = []; 
        let selectedTubeIndex = null; let playerMoves = 0; let hiddenBalls = [];
        const TUBE_CAPACITY = 6; 
        let activeLevelList = []; 
        let isGameWon = false;

        function calculateStars(playerMoves, minMoves) {
            if (playerMoves <= minMoves) return 3.0;
            if (playerMoves <= Math.ceil(minMoves * 1.15)) return 2.5; 
            if (playerMoves <= Math.ceil(minMoves * 1.30)) return 2.0; 
            if (playerMoves <= Math.ceil(minMoves * 1.45)) return 1.5; 
            if (playerMoves <= Math.ceil(minMoves * 1.65)) return 1.0; 
            return 0.5; 
        }

        function getStarsHtmlInner(stars, starClass) {
            let fullStars = Math.floor(stars);
            let hasHalf = (stars % 1 !== 0);
            let html = '';
            for(let i=0; i<fullStars; i++) {
                html += `<div class="${starClass}"></div>`;
            }
            if(hasHalf) {
                html += `<div class="${starClass} half"></div>`;
            }
            return html;
        }

        async function loadOfflineData() {
            try {
                let res = await fetch('data.json');
                gameData = await res.json();
            } catch (e) {
                console.error("Lỗi tải data.json:", e);
                gameData = { config: {}, activeLevels: [], levels: {} };
            }
        }

        function applyGameConfig() {
            let config = gameData.config || {};
            const logoImg = document.getElementById('game-logo-img');
            if (config.showTitle) { logoImg.style.display = 'block'; } else { logoImg.style.display = 'none'; }
            if (config.bgColor) document.documentElement.style.setProperty('--bg-color', config.bgColor);
            if (config.bgPattern) {
                let pattern = config.bgPattern;
                if (!pattern.startsWith('url') && !pattern.startsWith('linear')) pattern = `url('${pattern}')`;
                document.documentElement.style.setProperty('--bg-pattern', pattern);
                document.documentElement.style.setProperty('--bg-size', 'auto'); 
            }
            if (config.tubeBorder) document.documentElement.style.setProperty('--tube-border', config.tubeBorder);
            if (config.tubeBg) document.documentElement.style.setProperty('--tube-bg', config.tubeBg);
        }

        function setupActiveLevels() {
            activeLevelList = gameData.activeLevels || [];
            if (activeLevelList.length === 0) {
                for (let i = 1; i <= 80; i++) activeLevelList.push(i);
            }
            if (activeLevelList.length > 0 && !activeLevelList.includes(currentLevel)) currentLevel = activeLevelList[0];
        }

        function getRandomLevelData(levelNum) {
            let list = gameData.levels ? gameData.levels[levelNum] : null;
            if (list && list.length > 0) return list[Math.floor(Math.random() * list.length)]; 
            return null;
        }

        let audioCtx = null; let isMuted = false;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        document.body.addEventListener('pointerdown', initAudio, {once: true});
        
        function toggleMute() { 
            initAudio(); 
            isMuted = !isMuted; 
            let muteEl = document.getElementById('mute-icon'); 
            muteEl.src = isMuted ? './assets/icon/volume-x.svg' : './assets/icon/volume-max.svg'; 
        }

        function playSfx(type) {
            if (navigator.vibrate) {
                if (type === 'jump') navigator.vibrate(10);
                else if (type === 'drop') navigator.vibrate(40);
                else if (type === 'error') navigator.vibrate([50, 30, 50]);
                else if (type === 'win') navigator.vibrate([100, 50, 100, 50, 100]);
            }

            if (isMuted || !audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
            
            if (type === 'jump') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); } 
            else if (type === 'drop') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.1); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); } 
            else if (type === 'error') { osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.15); gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15); } 
            else if (type === 'win') { const notes = [261.63, 329.63, 392.00, 523.25]; notes.forEach((freq, i) => { const oscW = audioCtx.createOscillator(); const gainW = audioCtx.createGain(); oscW.connect(gainW); gainW.connect(audioCtx.destination); oscW.type = 'sine'; oscW.frequency.setValueAtTime(freq, now + i * 0.1); gainW.gain.setValueAtTime(0.2, now + i * 0.1); gainW.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2); oscW.start(now + i * 0.1); oscW.stop(now + i * 0.1 + 0.2); }); }
        }

        function triggerTubeParticles(rect, color) {
            for (let i = 0; i < 15; i++) {
                let p = document.createElement('div');
                p.style.position = 'fixed';
                p.style.left = (rect.left + rect.width / 2) + 'px';
                p.style.top = rect.top + 'px';
                p.style.width = (Math.random() * 6 + 4) + 'px';
                p.style.height = p.style.width;
                p.style.backgroundColor = color;
                p.style.borderRadius = '50%';
                p.style.pointerEvents = 'none';
                p.style.zIndex = '1000';
                p.style.boxShadow = `0 0 8px ${color}`;
                document.body.appendChild(p);

                let angle = (Math.random() * Math.PI) - Math.PI; 
                let velocity = 20 + Math.random() * 50;
                let tx = Math.cos(angle) * velocity;
                let ty = Math.sin(angle) * velocity - 20;

                let anim = p.animate([
                    { transform: `translate(0, 0) scale(1)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], { duration: 400 + Math.random() * 300, easing: 'ease-out', fill: 'forwards' });

                anim.onfinish = () => p.remove();
            }
        }

        function triggerConfetti() {
            const colors = ['#ff5252', '#448aff', '#76ff03', '#ffd740', '#e040fb', '#ffab40'];
            for (let i = 0; i < 70; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti'; conf.style.left = Math.random() * 100 + 'vw'; conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.width = (Math.random() * 8 + 8) + 'px'; conf.style.height = (Math.random() * 12 + 12) + 'px';
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's'; conf.style.animationDelay = Math.random() * 1 + 's';
                document.body.appendChild(conf); setTimeout(() => conf.remove(), 5000);
            }
        }

        function triggerFireworks() {
            const colors = ['#ff5252', '#448aff', '#76ff03', '#ffd740', '#e040fb', '#ffab40'];
            for (let i = 0; i < 6; i++) { 
                setTimeout(() => {
                    let startX = 15 + Math.random() * 70; let startY = 15 + Math.random() * 50; 
                    for (let j = 0; j < 35; j++) { 
                        let p = document.createElement('div');
                        p.style.position = 'fixed'; p.style.left = startX + 'vw'; p.style.top = startY + 'vh';
                        p.style.width = (Math.random() * 4 + 4) + 'px'; p.style.height = p.style.width;
                        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]; p.style.borderRadius = '50%';
                        p.style.pointerEvents = 'none'; p.style.zIndex = '9999'; p.style.boxShadow = `0 0 8px ${p.style.backgroundColor}`;
                        document.body.appendChild(p);

                        let angle = Math.random() * Math.PI * 2; let velocity = 40 + Math.random() * 120; 
                        let tx = Math.cos(angle) * velocity; let ty = Math.sin(angle) * velocity + 40; 
                        let anim = p.animate([{ transform: `translate(0, 0) scale(1)`, opacity: 1 }, { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }], { duration: 700 + Math.random() * 500, easing: 'cubic-bezier(0.25, 1, 0.5, 1)', fill: 'forwards' });
                        anim.onfinish = () => p.remove();
                    }
                }, i * 250); 
            }
        }

        window.onload = async function() { 
            document.getElementById('board').innerHTML = '<div style="color:#ffd700; font-size: 20px; margin-top:48px;">Loading Magic...</div>';
            await loadOfflineData(); applyGameConfig(); setupActiveLevels();
            if (activeLevelList.length === 0) document.getElementById('board').innerHTML = '<div style="color:#ff5252; font-size: 20px; text-align: center; margin-top:48px;">NO LEVELS FOUND!<br><span style="font-size:16px; color:#aaa;">(data.json is missing or empty)</span></div>';
            else initLevel(currentLevel);
        };

        function openLevelModal() { playSfx('jump'); renderLevelGrid(); document.getElementById('level-select-modal').style.display = 'flex'; }
        function closeLevelModal() { playSfx('drop'); document.getElementById('level-select-modal').style.display = 'none'; }

        function renderLevelGrid() {
            const container = document.getElementById('level-grid'); container.innerHTML = '';
            
            activeLevelList.forEach(levelNum => {
                let bestKey = 'ballmagic_best_lv_' + levelNum; let bestScore = localStorage.getItem(bestKey);
                let minMoves = 9999;
                if (gameData && gameData.levels && gameData.levels[levelNum] && gameData.levels[levelNum].length > 0) {
                    minMoves = gameData.levels[levelNum][0].metrics.minMoves || 9999;
                }

                let iconClass = 'level-icon-none'; let iconText = `${levelNum}`; let starsHtml = '';
                let scoreTextStr = `.../${minMoves}`; let textClass = 'level-text'; 

                if (bestScore) {
                    let pMoves = parseInt(bestScore); let stars = calculateStars(pMoves, minMoves); let isPerfect = (stars === 3.0);
                    if (isPerfect) { iconClass = 'level-icon-min'; textClass = 'level-text perfect'; } else { iconClass = 'level-icon-active'; }
                    scoreTextStr = `${pMoves}/${minMoves}`;
                    let totalIcons = Math.floor(stars) + (stars % 1 !== 0 ? 1 : 0);
                    starsHtml = `<div class="stars-container count-${totalIcons}">`; starsHtml += getStarsHtmlInner(stars, 'star'); starsHtml += '</div>';
                }

                let item = document.createElement('div'); item.className = 'level-item'; item.onclick = () => { selectLevelFromModal(levelNum); };
                item.innerHTML = `
                    <div style="position: relative; display: flex; flex-direction: column; align-items: center;">
                        ${starsHtml}
                        <div class="level-icon ${iconClass}">${iconText}</div>
                    </div>
                    <div class="${textClass}">${scoreTextStr}</div>
                `;
                container.appendChild(item);
            });
        }

        function selectLevelFromModal(levelNum) { closeLevelModal(); currentLevel = levelNum; localStorage.setItem('ballmagic_current_level', currentLevel); initLevel(currentLevel); }

        function initLevel(level) {
            currentLevel = level; localStorage.setItem('ballmagic_current_level', currentLevel);
            document.getElementById('level-btn').innerText = `Level ${currentLevel}`;
            hiddenBalls = []; document.getElementById('flying-ball-container').innerHTML = ''; playerMoves = 0; document.getElementById('player-moves').innerText = playerMoves;
            
            let bestKey = 'ballmagic_best_lv_' + currentLevel; let savedBest = localStorage.getItem(bestKey);
            let serverData = getRandomLevelData(currentLevel); let minMoves = 9999;

            if (serverData) {
                minMoves = (serverData.metrics && serverData.metrics.minMoves) ? serverData.metrics.minMoves : 9999;
                document.getElementById('min-moves').innerText = minMoves;
                const newPalette = ['#ff4141', '#10c278', '#0068ff', '#ff8c00', '#ffd000', '#00d0eb', '#6100ed', '#6c6c6c', '#7dd800', '#d30756', '#c600cc', '#cacaca'];
                let levelColorMap = {}; let paletteIdx = 0;
                let fixedMatrix = serverData.matrix.map(tube => tube.map(color => {
                    if (/^[0-9A-Fa-f]{6}$/.test(color)) color = '#' + color;
                    if (!levelColorMap[color]) { levelColorMap[color] = newPalette[paletteIdx % newPalette.length]; paletteIdx++; }
                    return levelColorMap[color];
                }));
                tubes = JSON.parse(JSON.stringify(fixedMatrix)); initialTubesState = JSON.parse(JSON.stringify(tubes));
                undoStack = []; selectedTubeIndex = null; renderBoard();
            } else {
                document.getElementById('board').innerHTML = '<div style="color:#ff5252; font-size: 24px; text-align: center; margin-top:48px;">LEVEL NOT AVAILABLE</div>';
                document.getElementById('min-moves').innerText = '-';
            }

            let bestEl = document.getElementById('best-moves');
            if (savedBest) {
                bestEl.innerText = savedBest;
                if (parseInt(savedBest) <= minMoves) bestEl.classList.add('perfect'); else bestEl.classList.remove('perfect');
            } else { bestEl.innerText = '...'; bestEl.classList.remove('perfect'); }
            isGameWon = false;
        }

        function restartLevel() { playSfx('drop'); initLevel(currentLevel); }
        function closeResultModal() { playSfx('drop'); document.getElementById('result-modal').style.display = 'none'; }

        function showWinModal() {
            let minValStr = document.getElementById('min-moves').innerText; let minVal = parseInt(minValStr) || 9999;
            let bestKey = 'ballmagic_best_lv_' + currentLevel; let savedBest = localStorage.getItem(bestKey);
            
            if (!savedBest || playerMoves < parseInt(savedBest)) {
                savedBest = playerMoves; localStorage.setItem(bestKey, savedBest);
                let bestEl = document.getElementById('best-moves'); bestEl.innerText = savedBest;
                if (parseInt(savedBest) <= minVal) bestEl.classList.add('perfect');
            }

            let stars = calculateStars(playerMoves, minVal); let isPerfect = (stars === 3.0);
            let popupStarsDiv = document.getElementById('popup-stars'); let totalIcons = Math.floor(stars) + (stars % 1 !== 0 ? 1 : 0);
            popupStarsDiv.innerHTML = getStarsHtmlInner(stars, 'popup-star'); popupStarsDiv.className = 'popup-stars-container count-' + totalIcons;

            triggerFireworks(); 

            if (isPerfect) {
                document.getElementById('modal-title-img').src = './assets/icon/title-perfect.png';
                document.getElementById('modal-subtitle').innerHTML = `<span style="font-size: 16px;">You have found the minimum number<br>of moves for Level ${currentLevel}.</span>`;
                document.getElementById('modal-score').style.display = 'block'; document.getElementById('modal-score').innerText = playerMoves;
                document.getElementById('modal-metrics-box').style.display = 'none';
                triggerConfetti(); 
            } else {
                document.getElementById('modal-title-img').src = './assets/icon/title-win.png';
                document.getElementById('modal-subtitle').innerHTML = "Your moves";
                document.getElementById('modal-score').style.display = 'block'; document.getElementById('modal-score').innerText = playerMoves;
                document.getElementById('modal-metrics-box').style.display = 'block'; document.getElementById('modal-lvl-text').innerText = currentLevel;
                document.getElementById('modal-min-moves-box').innerText = minValStr; document.getElementById('modal-best-moves').innerText = savedBest;
            }

            let btnLeft = document.getElementById('modal-btn-left'); btnLeft.style.display = 'flex'; btnLeft.innerText = "REPLAY"; btnLeft.onclick = () => { closeResultModal(); restartLevel(); };
            let btnRight = document.getElementById('modal-btn-right'); btnRight.innerText = "NEXT LEVEL"; btnRight.onclick = () => { closeResultModal(); nextLevelLogic(); };
            document.getElementById('result-modal').style.display = 'flex';
        }

        function showLoseModal() {
            let minVal = document.getElementById('min-moves').innerText; let bestKey = 'ballmagic_best_lv_' + currentLevel; let savedBest = localStorage.getItem(bestKey) || "...";
            document.getElementById('popup-stars').innerHTML = ''; document.getElementById('modal-title-img').src = './assets/icon/title-lose.png';
            document.getElementById('modal-subtitle').innerHTML = "Try going back<br>or resetting the game."; document.getElementById('modal-score').style.display = 'none';
            document.getElementById('modal-metrics-box').style.display = 'block'; document.getElementById('modal-lvl-text').innerText = currentLevel;
            document.getElementById('modal-min-moves-box').innerText = minVal; document.getElementById('modal-best-moves').innerText = savedBest;
            let btnLeft = document.getElementById('modal-btn-left'); btnLeft.style.display = 'flex'; btnLeft.innerText = "RETURN"; btnLeft.onclick = () => { closeResultModal(); undoMove(); };
            let btnRight = document.getElementById('modal-btn-right'); btnRight.innerText = "RESET"; btnRight.onclick = () => { closeResultModal(); restartLevel(); };
            document.getElementById('result-modal').style.display = 'flex';
        }

        function nextLevelLogic() {
            let currentIndexInList = activeLevelList.indexOf(currentLevel);
            if (currentIndexInList !== -1 && currentIndexInList < activeLevelList.length - 1) { currentLevel = activeLevelList[currentIndexInList + 1]; initLevel(currentLevel); } 
            else {
                document.getElementById('popup-stars').innerHTML = ''; document.getElementById('modal-title-img').src = './assets/icon/title-win.png';
                document.getElementById('modal-subtitle').innerHTML = "You have beaten<br>all available levels!"; document.getElementById('modal-score').style.display = 'none';
                document.getElementById('modal-metrics-box').style.display = 'none'; document.getElementById('modal-btn-left').style.display = 'none';
                document.getElementById('modal-btn-right').innerText = "CLOSE"; document.getElementById('modal-btn-right').onclick = closeResultModal;
                document.getElementById('result-modal').style.display = 'flex';
            }
        }

        function isWonState(state) { return state.every(t => t.length === 0 || (t.length === TUBE_CAPACITY && new Set(t).size === 1)); }
        function getCanonicalSignature(state) { let copies = state.map(t => [...t]); copies.sort((a, b) => a.join(',').localeCompare(b.join(','))); return JSON.stringify(copies); }
        
        async function checkSolvability(tubesState) {
            if (isWonState(tubesState)) return true;
            let queue = [JSON.parse(JSON.stringify(tubesState))]; let visited = new Set(); visited.add(getCanonicalSignature(tubesState)); let iterations = 0; const MAX_ITERATIONS = 50000;
            while (queue.length > 0) {
                if (iterations % 1000 === 0) await new Promise(resolve => setTimeout(resolve, 0));
                iterations++; let current = queue.shift();
                if (isWonState(current)) return true;
                for (let i = 0; i < current.length; i++) {
                    if (current[i].length === 0) continue;
                    let topColor = current[i][current[i].length - 1];
                    for (let j = 0; j < current.length; j++) {
                        if (i === j) continue;
                        let target = current[j]; let space = TUBE_CAPACITY - target.length;
                        if (space > 0 && (target.length === 0 || target[target.length - 1] === topColor)) {
                            let nextState = JSON.parse(JSON.stringify(current));
                            while (nextState[i].length > 0 && nextState[i][nextState[i].length - 1] === topColor && nextState[j].length < TUBE_CAPACITY) nextState[j].push(nextState[i].pop());
                            let sig = getCanonicalSignature(nextState);
                            if (!visited.has(sig)) { visited.add(sig); queue.push(nextState); }
                        }
                    }
                }
                if (iterations > MAX_ITERATIONS) return true;
            }
            return false;
        }

        function checkWin() {
            if (isGameWon) return false;
            let win = tubes.every(tube => tube.length === 0 || (tube.length === TUBE_CAPACITY && new Set(tube).size === 1));
            if (win) { isGameWon = true; playSfx('win'); setTimeout(() => { showWinModal(); }, 400); return true; }
            return false;
        }

        function checkGameOver() {
            if (isGameWon) return; let canMove = false;
            for (let i = 0; i < tubes.length; i++) {
                if (tubes[i].length === 0) continue; 
                let topColor = tubes[i][tubes[i].length - 1]; let consecutiveCount = 0;
                for(let k = tubes[i].length - 1; k >= 0; k--) { if(tubes[i][k] === topColor) consecutiveCount++; else break; }
                for (let j = 0; j < tubes.length; j++) {
                    if (i === j) continue; 
                    let targetSpace = TUBE_CAPACITY - tubes[j].length;
                    if (targetSpace > 0) {
                        if (tubes[j].length > 0 && tubes[j][tubes[j].length - 1] === topColor) { canMove = true; break; } 
                        else if (tubes[j].length === 0) { if (tubes[i].length > consecutiveCount) { canMove = true; break; } }
                    }
                }
                if (canMove) break;
            }
            if (!canMove) { playSfx('error'); showLoseModal(); }
        }

        function renderBoard() {
            const board = document.getElementById('board'); board.innerHTML = '';
            const numTubes = tubes.length; const topCount = Math.ceil(numTubes / 2); const rows = [ tubes.slice(0, topCount), tubes.slice(topCount) ];
            
            let maxTubesInRow = Math.max(...rows.map(r => r.length));
            if (maxTubesInRow >= 7) board.classList.add('compact'); else board.classList.remove('compact');

            let globalIndex = 0;
            rows.forEach((rowTubes) => {
                if (rowTubes.length === 0) return;
                const rowDiv = document.createElement('div'); rowDiv.className = 'row';
                rowTubes.forEach((tube) => {
                    let currentIndex = globalIndex++; const tubeDiv = document.createElement('div');
                    let isComplete = (tube.length === TUBE_CAPACITY && new Set(tube).size === 1);
                    let isWaitingForBall = hiddenBalls.some(h => h.tube === currentIndex);
                    
                    tubeDiv.className = `tube ${selectedTubeIndex === currentIndex ? 'selected' : ''} ${isComplete && !isWaitingForBall ? 'completed-magic' : ''}`;
                    tubeDiv.setAttribute('data-index', currentIndex); tubeDiv.onclick = () => handleTubeClick(currentIndex);
                    
                    tube.forEach((ballColor, ballIndex) => {
                        const ballDiv = document.createElement('div'); ballDiv.className = 'ball'; ballDiv.style.background = ballColor;
                        const overlayImg = document.createElement('img'); overlayImg.src = './assets/icon/bongbong.png'; overlayImg.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; border-radius:50%; pointer-events:none; z-index:2; object-fit:cover;';
                        ballDiv.appendChild(overlayImg);
                        let isHidden = hiddenBalls.some(h => h.tube === currentIndex && h.index === ballIndex);
                        if (isHidden) ballDiv.style.opacity = '0';
                        if (selectedTubeIndex === currentIndex && ballIndex === tube.length - 1 && !isHidden) ballDiv.classList.add('jump');
                        tubeDiv.appendChild(ballDiv);
                    });
                    rowDiv.appendChild(tubeDiv);
                });
                board.appendChild(rowDiv);
            });
        }

        function handleTubeClick(index) {
            initAudio(); 
            if (selectedTubeIndex === null) {
                if (tubes[index].length > 0) { selectedTubeIndex = index; playSfx('jump'); renderBoard(); }
            } else {
                if (selectedTubeIndex === index) { selectedTubeIndex = null; playSfx('drop'); renderBoard(); } 
                else {
                    let sourceTube = tubes[selectedTubeIndex]; let targetTube = tubes[index]; let topBall = sourceTube[sourceTube.length - 1];

                    if (targetTube.length < TUBE_CAPACITY && (targetTube.length === 0 || targetTube[targetTube.length - 1] === topBall)) {
                        const sourceNode = document.querySelector(`.tube[data-index='${selectedTubeIndex}']`).lastElementChild;
                        const targetNode = document.querySelector(`.tube[data-index='${index}']`);
                        const sourceRect = sourceNode.getBoundingClientRect();
                        
                        undoStack.push(JSON.parse(JSON.stringify(tubes))); selectedTubeIndex = null; 
                        let movingBall = sourceTube.pop(); targetTube.push(movingBall);
                        playerMoves++; document.getElementById('player-moves').innerText = playerMoves;
                        
                        let hiddenItem = { tube: index, index: targetTube.length - 1 }; hiddenBalls.push(hiddenItem); renderBoard(); 
                        
                        const newTargetNode = document.querySelector(`.tube[data-index='${index}']`).lastElementChild;
                        const targetRect = newTargetNode ? newTargetNode.getBoundingClientRect() : targetNode.getBoundingClientRect();
                        
                        const flyingBall = document.createElement('div'); flyingBall.className = 'ball';
                        flyingBall.style.position = 'fixed'; flyingBall.style.margin = '0'; flyingBall.style.background = movingBall; flyingBall.style.zIndex = '9999';
                        flyingBall.style.width = sourceRect.width + 'px'; flyingBall.style.height = sourceRect.height + 'px';
                        
                        const flyingOverlay = document.createElement('img'); flyingOverlay.src = './assets/icon/bongbong.png'; flyingOverlay.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; border-radius:50%; pointer-events:none; z-index:2; object-fit:cover;';
                        flyingBall.appendChild(flyingOverlay);

                        const jumpHeight = Math.min(sourceRect.top, targetRect.top) - 48;
                        flyingBall.style.left = '0px'; flyingBall.style.top = '0px'; document.getElementById('flying-ball-container').appendChild(flyingBall);

                        const anim = flyingBall.animate([{ transform: `translate(${sourceRect.left}px, ${sourceRect.top}px)` }, { transform: `translate(${sourceRect.left}px, ${jumpHeight}px)`, easing: 'ease-out', offset: 0.25 }, { transform: `translate(${targetRect.left}px, ${jumpHeight}px)`, easing: 'ease-in-out', offset: 0.65 }, { transform: `translate(${targetRect.left}px, ${targetRect.top}px)`, easing: 'ease-in', offset: 0.85 }, { transform: `translate(${targetRect.left}px, ${targetRect.top - 12}px)`, easing: 'ease-out', offset: 0.92 }, { transform: `translate(${targetRect.left}px, ${targetRect.top}px)`, easing: 'ease-in', offset: 1.0 }], { duration: 350, fill: 'forwards' });
                        
                        anim.onfinish = () => {
                            flyingBall.remove(); playSfx('drop'); hiddenBalls = hiddenBalls.filter(h => h !== hiddenItem); renderBoard(); 
                            
                            const currentTargetTubeEl = document.querySelector(`.tube[data-index='${index}']`);
                            if(currentTargetTubeEl && currentTargetTubeEl.lastElementChild) {
                                currentTargetTubeEl.lastElementChild.classList.add('squash');
                                setTimeout(() => { if(currentTargetTubeEl.lastElementChild) currentTargetTubeEl.lastElementChild.classList.remove('squash'); }, 200);
                            }

                            let targetTubeArr = tubes[index];
                            if (targetTubeArr.length === TUBE_CAPACITY && new Set(targetTubeArr).size === 1) {
                                triggerTubeParticles(currentTargetTubeEl.getBoundingClientRect(), targetTubeArr[0]);
                            }
                            
                            if (!checkWin()) {
                                setTimeout(() => { checkSolvability(tubes).then(isSolvable => { if (!isSolvable) { playSfx('error'); showLoseModal(); } else { checkGameOver(); } }); }, 50);
                            }
                        };
                    } else { playSfx('error'); if (targetTube.length > 0) { selectedTubeIndex = index; renderBoard(); } }
                }
            }
        }

        function undoMove() {
            playSfx('drop'); hiddenBalls = []; document.getElementById('flying-ball-container').innerHTML = ''; 
            if (undoStack.length > 0) { tubes = undoStack.pop(); selectedTubeIndex = null; playerMoves = Math.max(0, playerMoves - 1); document.getElementById('player-moves').innerText = playerMoves; renderBoard(); } 
        }

    </script>
